name: Test framework
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  unit-and-collection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - run: python -m unittest discover -s tests -v
      - run: python run.py standalone --suite full --dry-run
      - run: python run.py cluster --restart --local --suite full --dry-run
      - run: python -m pytest integration --mode standalone --artifacts /tmp/collection --collect-only -q
      - run: python -m pytest integration --mode cluster --artifacts /tmp/collection --collect-only -q
